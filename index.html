<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Redizajn Interiéru — Švajčiarska Architektúra & Flux</title>
    <!-- Link PWA Web Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Meta tag color matching style -->
    <meta name="theme-color" content="#1C1C1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker in background -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((registration) => {
              console.log("[PWA Link] Service Worker registered successfully with scope: ", registration.scope);
            })
            .catch((error) => {
              console.error("[PWA Warning] Service Worker registration failed: ", error);
            });
        });
      }
    </script>
  </body>
</html>
